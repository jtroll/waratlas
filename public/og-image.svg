<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wars Atlas social card — 1200x630, the standard OG/Twitter aspect.
  Pure SVG so it gzips small and never blurs. Mirrors the editorial
  redesign: Source Serif wordmark, vermilion italic "Wars", JetBrains
  mono stat strip. Falls back to system fonts if Google Fonts hasn't
  loaded for the social-image renderer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Wars Atlas — every named war in human history">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c1119"/>
      <stop offset="100%" stop-color="#06090f"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#1a1f2b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45"/>

  <!-- Decorative timeline tick row near the top -->
  <g stroke="#2a3242" stroke-width="1" opacity="0.7">
    <line x1="80" y1="80" x2="1120" y2="80"/>
    <g fill="#3a4456">
      <circle cx="180" cy="80" r="2.5"/>
      <circle cx="320" cy="80" r="2.5"/>
      <circle cx="460" cy="80" r="2.5"/>
      <circle cx="600" cy="80" r="2.5"/>
      <circle cx="740" cy="80" r="2.5"/>
      <circle cx="880" cy="80" r="2.5"/>
      <circle cx="1020" cy="80" r="2.5"/>
    </g>
  </g>

  <!-- Vermilion conflict markers, scattered at importance-weighted radii -->
  <g fill="#c8553b" opacity="0.7">
    <circle cx="285" cy="335" r="14"/>
    <circle cx="730" cy="285" r="22"/>
    <circle cx="965" cy="370" r="16"/>
    <circle cx="510" cy="425" r="11"/>
    <circle cx="395" cy="240" r="8"/>
    <circle cx="845" cy="465" r="13"/>
  </g>
  <g fill="#c8553b" opacity="0.18">
    <circle cx="285" cy="335" r="36"/>
    <circle cx="730" cy="285" r="56"/>
    <circle cx="965" cy="370" r="42"/>
    <circle cx="510" cy="425" r="28"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="160" fill="#9a8975" font-family="ui-sans-serif, 'Inter Tight', system-ui, sans-serif" font-size="14" letter-spacing="4">
    AN INTERACTIVE CARTOGRAPHY OF ARMED CONFLICT
  </text>

  <!-- Wordmark — italic vermilion 'Wars' + upright ink 'Atlas' -->
  <text x="80" y="290" font-family="ui-serif, 'Source Serif 4', Georgia, serif" font-size="118" font-weight="400">
    <tspan fill="#c8553b" font-style="italic">Wars</tspan><tspan fill="#ece3d3" dx="14">Atlas</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="360" fill="#bdb09a" font-family="ui-serif, 'Source Serif 4', Georgia, serif" font-size="34" font-style="italic">
    Every named war in human history.
  </text>

  <!-- Stat strip -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2">
    <line x1="80" y1="490" x2="1120" y2="490" stroke="#2a3242"/>
    <g transform="translate(80, 540)">
      <text fill="#ece3d3" font-family="ui-serif, 'Source Serif 4', Georgia, serif" font-size="42" font-weight="500">1,340</text>
      <text x="0" y="40" fill="#7a8295">CONFLICTS</text>
    </g>
    <g transform="translate(310, 540)">
      <text fill="#ece3d3" font-family="ui-serif, 'Source Serif 4', Georgia, serif" font-size="42" font-weight="500">372</text>
      <text x="0" y="40" fill="#7a8295">EMPIRES</text>
    </g>
    <g transform="translate(500, 540)">
      <text fill="#ece3d3" font-family="ui-serif, 'Source Serif 4', Georgia, serif" font-size="42" font-weight="500">5,000</text>
      <text x="0" y="40" fill="#7a8295">YEARS</text>
    </g>
    <g transform="translate(720, 540)">
      <text fill="#ece3d3" font-family="ui-serif, 'Source Serif 4', Georgia, serif" font-size="42" font-weight="500">700</text>
      <text x="0" y="40" fill="#7a8295">CITY-NAME RECORDS</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="1120" y="595" fill="#5a6478" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" text-anchor="end" letter-spacing="2">
    WARS-ATLAS · EDITORIAL · OPEN
  </text>
</svg>
